<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#808080"/>
    </marker>
  </defs>
  <text x="360" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#808080">connie Compose: base + override — run time</text>

  <!-- base compose -->
  <rect x="40" y="58" width="300" height="214" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="56" y="84" font-size="14" font-weight="700" fill="#1e3a8a">docker-compose.yml (committed)</text>
  <text x="56" y="102" font-size="11.5" font-style="italic" fill="#1e40af">the security floor — every project</text>
  <g font-size="12.5" fill="#1e3a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="56" y="130">read_only: true</text>
    <text x="56" y="152">cap_drop: [ALL]</text>
    <text x="56" y="174">security_opt: no-new-privileges</text>
    <text x="56" y="196">user: "1000:1000"</text>
    <text x="56" y="218">tmpfs: /tmp · init: true</text>
    <text x="56" y="240">mem_limit / cpus / pids_limit</text>
  </g>

  <!-- override -->
  <rect x="380" y="58" width="300" height="214" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="396" y="84" font-size="14" font-weight="700" fill="#7c2d12">&lt;override&gt;.yml (generated)</text>
  <text x="396" y="102" font-size="11.5" font-style="italic" fill="#92400e">per-project, from merged config (temp)</text>
  <g font-size="12.5" fill="#7c2d12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="396" y="130">build.args: packages, build_cmds</text>
    <text x="396" y="152">environment:  (env)</text>
    <text x="396" y="174">volumes:  (mounts)</text>
    <text x="396" y="196">ports:</text>
    <text x="396" y="218">mem_limit · cpus · pids_limit</text>
    <text x="396" y="240">command: [claude, --append-…]</text>
  </g>

  <!-- arrows into the merge pill -->
  <line x1="190" y1="272" x2="250" y2="300" stroke="#808080" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="530" y1="272" x2="470" y2="300" stroke="#808080" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- merge pill -->
  <rect x="150" y="302" width="420" height="32" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="323" font-size="11.5" text-anchor="middle" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">docker compose -f docker-compose.yml -f &lt;override&gt; run</text>

  <line x1="360" y1="334" x2="360" y2="366" stroke="#808080" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- container -->
  <rect x="110" y="368" width="500" height="92" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="360" y="396" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">Running container</text>
  <text x="360" y="420" font-size="12.5" text-anchor="middle" fill="#166534">base floor (read-only · cap_drop · no-new-privileges · user 1000)</text>
  <text x="360" y="440" font-size="12.5" text-anchor="middle" fill="#166534">+ your env · ports · mounts · limits · command</text>

  <text x="360" y="484" font-size="11" font-style="italic" text-anchor="middle" fill="#808080">The override only adds the per-project keys — it cannot weaken the floor.</text>
</svg>
