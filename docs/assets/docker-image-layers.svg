<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#808080"/>
    </marker>
  </defs>
  <text x="360" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#808080">connie image layers — build time</text>

  <!-- per-project image -->
  <rect x="90" y="64" width="540" height="98" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="110" y="92" font-size="15" font-weight="700" fill="#7c2d12">Per-project image · connie-&lt;slug&gt;-workspace</text>
  <text x="110" y="116" font-size="12.5" fill="#7c2d12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">extend.Dockerfile — adds packages (apk) + build_commands</text>
  <text x="110" y="140" font-size="11.5" font-style="italic" fill="#92400e">built per project by connie build / run (layer-cached)</text>

  <line x1="360" y1="210" x2="360" y2="164" stroke="#808080" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="190" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#808080">FROM</text>

  <!-- base image -->
  <rect x="90" y="212" width="540" height="98" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="110" y="240" font-size="15" font-weight="700" fill="#1e3a8a">Base image · connie/base:latest</text>
  <text x="110" y="264" font-size="12.5" fill="#1e3a8a">core tools + Node + Claude Code · non-root user 1000 · SUID-stripped</text>
  <text x="110" y="288" font-size="11.5" font-style="italic" fill="#1e40af">built once, shared by every project (connie build-base)</text>

  <line x1="360" y1="358" x2="360" y2="312" stroke="#808080" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="338" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#808080">FROM</text>

  <!-- alpine -->
  <rect x="90" y="360" width="540" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="394" font-size="14" font-weight="700" fill="#334155" font-family="ui-monospace, Menlo, monospace">alpine:3.20  (pinned by digest)</text>
</svg>
