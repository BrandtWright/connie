# Release automation for connie.
#
# Triggered by pushing a SemVer tag, e.g.:
#
#     git push origin v0.5.0
#
# The job:
#   1. verifies the tag matches the VERSION baked into src/connie,
#   2. extracts the matching section from docs/CHANGELOG.md as the notes,
#   3. runs a fast sanity gate (syntax check + the non-Docker test suite),
#   4. publishes a GitHub Release with those notes.
#
# Pre-1.0 tags (0.x) are published as GitHub *pre-releases*: connie is not
# yet API-stable, and 1.0.0 is the deliberate "stable" milestone.
#
# The full cross-platform matrix (ci.yml) runs on the underlying commit when
# main is pushed; this workflow is only the publish step layered on top, so it
# stays lean (one Linux job, yq the only extra dependency).

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install dependencies
        run: |
          sudo apt-get update
          # yq v4 — the test suite needs it; the apt package is v3.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: verify tag matches src/connie VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(sed -n 's/^VERSION="\(.*\)"/\1/p' src/connie)"
          echo "tag=$tag_version  src/connie VERSION=$file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/connie VERSION ($file_version)"
            exit 1
          fi

      - name: extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Print the body between this version's heading and the next one,
          # trimming leading/trailing blank lines and the trailing '---'
          # rule that separates CHANGELOG sections.
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/         { exit }
            grab                     { buf[n++] = $0 }
            END {
              end = n - 1
              while (end >= 0 && (buf[end] ~ /^[[:space:]]*$/ || buf[end] ~ /^---[[:space:]]*$/)) end--
              start = 0
              while (start <= end && buf[start] ~ /^[[:space:]]*$/) start++
              for (i = start; i <= end; i++) print buf[i]
            }
          ' docs/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section found for [$ver]"
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: sanity gate (syntax + tests)
        run: |
          make check
          make test

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Pre-1.0 releases are not API-stable → flag as a pre-release.
          case "$ver" in
            0.*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "connie $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease
