# CI for connie.
#
# Three jobs:
#
#   - lint: static checks (`make check`, `make lint`, `make format-check`).
#     These are OS-independent — shellcheck/shfmt/markdownlint/hadolint give
#     the same verdict everywhere — so they run once, on ubuntu-latest, and
#     gate merging.
#
#   - test: the non-Docker suite (`make test` + a dash re-run) across a
#     platform matrix. connie is a POSIX-sh CLI that runs on the user's
#     *host*, so the userland it shells out to matters:
#       * ubuntu-latest      — x86_64, GNU coreutils (the common case)
#       * ubuntu-24.04-arm   — arm64, GNU coreutils
#       * macos-latest       — arm64, BSD coreutils + an old /bin/sh
#     The GNU-vs-BSD split is the real signal here (different sed/grep/
#     mktemp/find semantics); arm64 covers Apple Silicon and arm servers.
#     `fail-fast: false` so one platform's failure still lets the others
#     report — useful when a BSD-only regression surfaces.
#
#   - test-docker: the full container lifecycle (`make test-docker`) on
#     both x86_64 and arm64 Linux, so the Alpine base image, the Claude
#     install, and the runtime hardening are all exercised natively on
#     each architecture. macOS is absent here on purpose: GitHub's macOS
#     runners cannot run Linux containers, and connie's containers are
#     always Linux regardless of host.
#
# Dependencies are installed fresh each run rather than cached: the
# non-Docker jobs are dominated by a few seconds of package installs, and
# the Docker job's wall time is dominated by `docker build`, not installs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref — avoids spending (pricier) macOS
# and arm64 minutes on commits that a newer push has already obsoleted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (static checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies
        run: |
          sudo apt-get update
          # shellcheck (POSIX-sh lint) and yamllint (YAML lint — `make
          # lint-yaml` prefers it for duplicate-key + hygiene checks).
          sudo apt-get install -y shellcheck yamllint
          # yq v4 — the apt package on ubuntu is v3 (incompatible API).
          # Install the v4 binary from the upstream release as the script does.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # markdownlint-cli2 — author-maintained CLI for the markdownlint
          # library; our `make lint-md` target invokes it directly.
          sudo npm install -g markdownlint-cli2
          # hadolint static binary (Dockerfile linter).
          sudo wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          # shfmt — the formatter `make format-check` enforces. The release
          # filename embeds the version, so pin it rather than use /latest.
          sudo wget -qO /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt

      - name: syntax check
        run: make check

      - name: lint
        run: make lint

      - name: format check
        # Fails if any shell script drifts from shfmt style. The target
        # skips (exit 0) when shfmt is absent, but it's installed above so
        # this is a real gate here.
        run: make format-check

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu's /bin/sh is already dash, but install it explicitly so
          # the dash step below does not depend on that staying true.
          sudo apt-get install -y dash
          # yq v4 binary, architecture-aware (amd64 vs arm64 runner).
          case "$(uname -m)" in
            x86_64)        yq_asset=yq_linux_amd64 ;;
            aarch64|arm64) yq_asset=yq_linux_arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/${yq_asset}"
          sudo chmod +x /usr/local/bin/yq

      - name: install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          # dash mirrors the Linux POSIX-sh re-run on a BSD host (macOS
          # /bin/sh is an old bash; dash is the strict check). Pin --formula:
          # Homebrew also has a *cask* named `dash` (the Dash.app docs
          # browser), and `brew install dash` is ambiguous — we want the
          # POSIX shell, not a GUI app.
          brew install --formula dash
          # yq v4 ships preinstalled on GitHub's macOS runners; only install
          # if it is somehow absent, to avoid a noisy "already installed".
          command -v yq >/dev/null 2>&1 || brew install --formula yq

      - name: tool versions
        run: |
          yq --version
          sh --version 2>/dev/null || true

      - name: tests (default shell)
        run: make test

      - name: tests (dash — POSIX-sh portability check)
        # Re-run under dash to catch constructs a more permissive /bin/sh
        # (bash --posix on Linux, an old bash on macOS) would let through.
        run: dash tests/run.sh

  test-docker:
    name: Docker tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          case "$(uname -m)" in
            x86_64)        yq_asset=yq_linux_amd64 ;;
            aarch64|arm64) yq_asset=yq_linux_arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/${yq_asset}"
          sudo chmod +x /usr/local/bin/yq

      - name: docker info
        # GitHub-hosted Ubuntu runners (x86_64 and arm64) ship Docker
        # pre-installed and running; this verifies the daemon is reachable
        # so a failure here points at the runner image, not the test layer.
        run: docker info

      - name: test-docker
        run: make test-docker
