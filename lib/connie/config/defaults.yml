# connie compiled-in defaults
# These are the lowest-precedence values in the config hierarchy.
# They are overridden by system, user, and project config in that order.
#
# To change a default for all projects on your machine, copy the relevant
# key to ~/.config/connie/config.yml and set your preferred value there.
# Do not edit this file — it will be overwritten on upgrade.

start_cmd: claude

resources:
  memory: 4g
  cpus: "2.0"
  max_pids: 512

packages: []
env: {}
volumes: []
ports: []
