MD013:
  code_blocks: false
  tables: false
MD024:
  siblings_only: true
# MD054 — enforce reference-style links over inline. Inline
# `[text](long-url)` makes line wrapping awkward and scatters URL
# maintenance across the document; reference-style groups URLs at
# the bottom of the file. Autolinks (`<https://…>`) and the three
# reference variants stay allowed; the two banned variants are
# inline (`[text](url)`) and url-inline (`[https://x](https://x)`).
MD054:
  autolink: true
  inline: false
  full: true
  collapsed: true
  shortcut: true
  url_inline: false
