# connie compiled-in defaults
# These are the lowest-precedence values in the config hierarchy.
# Higher layers (system, user, project) compose on top of these additively:
# overriding scalar and map values, and accumulating the list keys (packages,
# build_commands, ports, unsafe_extra_mounts).
#
# To change a default for all projects on your machine, copy the relevant
# key to ~/.config/connie/config.yml and set your preferred value there.
# Do not edit this file — it will be overwritten on upgrade.

start_cmd: claude

resources:
  memory: 4g
  cpus: "2.0"
  max_pids: 512

packages: []
build_commands: []
env: {}
ports: []
# Advanced opt-in: extra host bind mounts beyond the project dir and Claude
# Code state. Defaults to none — the only writable host path is your project.
# See SECURITY.md before using; these are trusted, lightly-guarded mounts.
unsafe_extra_mounts: []
