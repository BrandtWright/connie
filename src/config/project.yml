# ~/.config/connie/projects/<slug>/config.yml
# connie project configuration
#
# This file describes what this project needs from its container environment.
# It is the only connie file you should ever need to edit.
#
# connie reads config from multiple sources in this order
# (lowest to highest precedence):
#
#   1. connie compiled-in defaults
#   2. /etc/xdg/connie/config.yml   (system-wide, set by admin)
#   3. ~/.config/connie/config.yml  (your personal preferences)
#   4. This file                    (project-specific requirements)
#   5. CONNIE_CMD, CONNIE_MEMORY, CONNIE_CPUS, CONNIE_MAX_PIDS (env vars)
#   6. CLI flags (--package, --env, --cmd)
#
# Higher-precedence sources override lower ones.

# ── Packages ──────────────────────────────────────────────────────────────────
# Additional packages to install into the container at build time.
# These are installed via apk (Alpine Package Keeper).
# The base image already includes: bash, coreutils, grep, sed, gawk, findutils,
# git, curl, wget, ripgrep, fd, jq, tree, file, tar, gzip, unzip, lsof,
# build-base, and Claude Code. Add project-specific tools here.
# Changing this list triggers a rebuild; the result is cached by Docker.
#
# packages:
#   - python3
#   - py3-pip
#   - nodejs
#   - npm
#   - jq

packages: []

# ── Build commands ────────────────────────────────────────────────────────────
# Arbitrary shell commands run at image build time, as claude-user.
# Executed after apk packages are installed, so apk-installed tools are
# available. Use for package managers that don't map to apk.
# Commands run in sequence and the build fails if any command fails.
#
# Note: the base image does not expose a standalone npm. To use npm here,
# add nodejs and npm to packages: first.
#
# build_commands:
#   - npm install -g markdownlint-cli2  # requires packages: [nodejs, npm]
#   - pip install black ruff            # requires packages: [python3, py3-pip]

build_commands: []

# ── Environment variables ─────────────────────────────────────────────────────
# Injected into the container at runtime.
# Safe to commit — do not put secret values here.
# Names must be identifiers: [A-Za-z0-9_][A-Za-z0-9_.-]*
#
# NOTE: values are LITERAL. connie does not perform docker compose
# interpolation, so "${HOME}" or "$USER" in any config value is passed
# through verbatim (a '$' is not expanded from connie's environment).
#
# env:
#   APP_ENV: development
#   LOG_LEVEL: debug

env: {}

# ── Mounts ────────────────────────────────────────────────────────────────────
# By default the ONLY writable host path inside the container is your project
# (mounted at /workspace), plus this project's Claude Code state:
#   [project root]                            → /workspace           (read/write)
#   ~/.local/state/connie/<slug>/.claude/     → ~/.claude/           (read/write)
#   ~/.local/state/connie/<slug>/.claude.json → ~/.claude.json       (read/write)
#
# ADVANCED / opt-in: to mount additional host paths (a shared dataset, a
# sibling repo, a cache dir), use `unsafe_extra_mounts:`. It is deliberately
# named: an extra host mount is the one config key that can hand the container
# a host resource, so adding one widens your trust surface. connie still
# refuses the catastrophic cases (the Docker socket, /proc, /sys, /dev, the
# daemon data root, host root, mounts that shadow the standard mounts, unsafe
# propagation), but the guard is best-effort — see SECURITY.md. Only add what
# you must, and prefer `:ro`.
#
# Format: host_path:container_path[:options]
# unsafe_extra_mounts:
#   - /data/shared:/data:ro

# ── Ports ─────────────────────────────────────────────────────────────────────
# Port mappings exposed from the container to your host.
# Format: "host_port:container_port"
#
# ports:
#   - "8080:8080"

ports: []

# ── Start command ─────────────────────────────────────────────────────────────
# The command connie drops you into when the container starts.
# Defaults to 'claude' (Claude Code). Override for debugging with:
#   connie run --cmd sh
#
start_cmd: claude

# ── Resource limits ───────────────────────────────────────────────────────────
# Defaults are defined in connie's compiled-in defaults.
# Uncomment and adjust only if this project has unusual resource needs.
#
# resources:
#   memory: 4g      # RAM limit (Docker notation: 512m, 1g, 4g, etc.)
#   cpus: "2.0"     # CPU limit (decimal string: "0.5", "1.0", "4.0")
#   max_pids: 512   # Maximum number of processes
